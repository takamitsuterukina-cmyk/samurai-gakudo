<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>利用予定の登録</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --accent:#3E6B49;
    --accent-soft:#EAF1E7;
    --paper:#F6F4EC;
    --surface:#FFFFFF;
    --ink:#23261E;
    --ink-soft:#767a6c;
    --line:#DEDBC8;
    --amber:#A8642A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;
    padding-bottom:90px;
  }
  header{
    padding:16px 16px 8px;
    text-align:center;
  }
  header .childname{font-size:13px;color:var(--ink-soft);}
  header h1{font-size:17px;margin:2px 0 0;}
  header .guide{font-size:12px;color:var(--ink-soft);margin-top:6px;line-height:1.5;}
  #status{padding:40px 16px;text-align:center;color:var(--ink-soft);font-size:14px;}

  .monthbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 16px;
  }
  .monthbar button{
    border:none;background:var(--surface);border:1px solid var(--line);
    border-radius:8px;width:36px;height:36px;font-size:16px;color:var(--accent);
  }
  .monthbar .label{font-weight:700;font-size:16px;}

  .cal{
    background:var(--surface);
    margin:0 16px;border-radius:12px;border:1px solid var(--line);
    padding:10px;
  }
  .cal .dow{
    display:grid;grid-template-columns:repeat(7,1fr);
    font-size:11px;color:var(--ink-soft);text-align:center;margin-bottom:4px;
  }
  .cal .days{
    display:grid;grid-template-columns:repeat(7,1fr);gap:4px;
  }
  .day{
    aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    border-radius:8px;font-size:14px;background:transparent;border:none;
    color:var(--ink);position:relative;
  }
  .day.empty{visibility:hidden;}
  .day.selected{background:var(--accent);color:#fff;font-weight:700;}
  .day.disabled{color:var(--line);cursor:default;}
  .day .dot{
    position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--amber);
  }

  #list{padding:16px;display:flex;flex-direction:column;gap:10px;}
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
  }
  .card .cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .card .datelabel{font-weight:700;font-size:14px;}
  .card .remove{color:var(--ink-soft);font-size:12px;background:none;border:none;padding:4px;}
  .toggle-row{display:flex;gap:8px;margin-bottom:8px;}
  .toggle-row button{
    flex:1;padding:8px 0;border-radius:8px;border:1px solid var(--line);background:var(--paper);
    font-size:13px;color:var(--ink);
  }
  .toggle-row button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}
  .detail-row{display:flex;gap:8px;align-items:center;font-size:13px;}
  .detail-row label{color:var(--ink-soft);width:64px;flex:none;}
  .detail-row input[type=time]{
    flex:1;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:14px;background:var(--paper);
  }

  #childpick{margin:0 16px 8px;display:none;}
  #childpick .pickhead{font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
  #childpick .chips{display:flex;flex-wrap:wrap;gap:8px;}
  #childpick .chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--ink);}
  #childpick .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}
  #childpick .pickmsg{font-size:11px;color:var(--amber);margin-top:6px;line-height:1.5;}
  .viewcard .who{font-size:12px;color:var(--accent);font-weight:700;margin-top:4px;}

  #empty-hint{padding:24px 16px;text-align:center;color:var(--ink-soft);font-size:13px;}

  .switchlink{margin-top:10px;}
  .switchlink a{color:var(--accent);font-size:13px;font-weight:700;text-decoration:none;border-bottom:1px solid var(--accent);padding-bottom:1px;}

  #viewList{padding:16px;display:flex;flex-direction:column;gap:10px;}
  .viewcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
  .viewcard.past{opacity:0.5;}
  .viewcard .viewdetail{font-size:13px;color:var(--ink-soft);margin-top:4px;}
  .loadingmsg{padding:40px 16px;text-align:center;color:var(--ink-soft);font-size:13px;}

  .card .existing-tag{font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 6px;margin-left:6px;font-weight:700;}

  footer{
    position:fixed;bottom:0;left:0;right:0;
    background:var(--surface);border-top:1px solid var(--line);
    padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom));
  }
  footer button{
    width:100%;padding:13px 0;border:none;border-radius:10px;
    background:var(--accent);color:#fff;font-size:15px;font-weight:700;
  }
  footer button:disabled{background:#B9C4B4;}
  #submitmsg{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:6px;}
</style>
</head>
<body>

<div id="status">読み込み中...</div>

<div id="app" style="display:none">
  <header>
    <div class="childname" id="childname"></div>
    <h1 id="pageTitle">利用予定を登録する</h1>
    <div class="guide" id="pageGuide">カレンダーから複数日をまとめてタップして選び、最後に1回「送信する」だけでOKです。</div>
    <div class="switchlink" id="switchLink"></div>
  </header>

  <div id="inputPane">
    <div id="childpick"><div class="pickhead">予定を登録するお子さん（タップで選択・複数選ぶとまとめて登録）</div><div class="chips" id="chips"></div><div class="pickmsg" id="pickmsg"></div></div>
    <div class="monthbar">
      <button id="prevMonth">‹</button>
      <div class="label" id="monthLabel"></div>
      <button id="nextMonth">›</button>
    </div>

    <div class="cal">
      <div class="dow"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div>
      <div class="days" id="days"></div>
    </div>

    <div id="empty-hint">通う日をカレンダーからタップして選んでください。複数日を選んでからまとめて送信できます。</div>
    <div id="list"></div>
  </div>

  <div id="viewPane" style="display:none">
    <div id="viewList"></div>
  </div>

  <footer id="inputFooter">
    <button id="submitBtn" disabled>選択した日を送信する</button>
    <div id="submitmsg"></div>
  </footer>
</div>

<script>
const GAS_URL = 'https://line-webhook-proxy-parent.takamitsuterukina.workers.dev/'; // POST送信先(Cloudflare Worker経由)
const GAS_DIRECT_URL = 'https://script.google.com/macros/s/AKfycbza6QFA-uhlzqz3v6JOiRI-VkOnLACZq_PM1lC9ElI2J9NpWM7MjjZtwDHLj5MRYMrs/exec'; // childInfo取得用(GET)
const LIFF_ID = '2011804898-e4TDAddj';
const PICKUP_LOCATIONS = { genkan: '玄関', classroom: '子ども教室' };

let userId = null;
let childInfo = null;
let viewYear, viewMonth; // viewMonth: 0-11
const selected = {}; // { 'YYYY-MM-DD': {pickup, location, startTime} } - 今日以降の「現在の予定」を常に表す
let originalReports = {}; // 画面を開いた時点で既に登録されていた内容のスナップショット(変更/取り消しの判定用)
let children = [];            // 登録されているお子さん(きょうだいがいれば複数)
let selectedChildren = [];    // 今、予定を登録する対象のお子さん(複数ならまとめて登録)
let reportsByChild = {};      // { お子さん名: { 'YYYY-MM-DD': {pickup, location, startTime} } } 今日以降の登録済みの内容
let todayKeyG = '';
let holidaySet = new Set(); // 'YYYY-MM-DD' -> 祝日名(内閣府準拠の公開データ)

function pad(n){ return String(n).padStart(2,'0'); }
function dateKey(y,m,d){ return y+'-'+pad(m+1)+'-'+pad(d); }

async function loadHolidays(){
  try{
    const res = await fetch('https://holidays-jp.github.io/api/v1/date.json');
    const data = await res.json();
    holidaySet = new Set(Object.keys(data));
    renderMonth(); // 取得完了後にカレンダーを再描画して祝日をブロックする
  }catch(e){
    // 取得できなくても致命的ではない(日曜日の判定だけは機能する)ので無視する
  }
}

/* 日曜日・祝日は休所のため予約不可とする。学童アプリ側で個別設定している閉所日(お盆・年末年始等)は
   現時点ではここに連携できていないため対象外(今後の同期対応で解消予定)。 */
function isBookable(key, dow){
  if(dow === 0) return false;
  if(holidaySet.has(key)) return false;
  return true;
}

async function boot(){
  try{
    await liff.init({ liffId: LIFF_ID });
    if(!liff.isLoggedIn()){ liff.login(); return; }
    loadHolidays(); // カレンダー描画をブロックしないよう非同期のまま進める(読み込み完了後に自動で再描画)
    const idToken = liff.getDecodedIDToken();
    userId = idToken.sub;
    const res = await fetch(GAS_DIRECT_URL + '?action=childInfo&userId=' + encodeURIComponent(userId));
    childInfo = await res.json();
    if(!childInfo.registered){
      document.getElementById('status').textContent = 'まだお子さんの登録が済んでいません。トーク画面でお名前を送って登録してから開いてください。';
      return;
    }
    children = (childInfo.children && childInfo.children.length) ? childInfo.children : [childInfo.childName];
    document.getElementById('childname').textContent = children.join('・') + ' さん';
    const now = new Date();
    viewYear = now.getFullYear();
    viewMonth = now.getMonth();
    todayKeyG = dateKey(now.getFullYear(), now.getMonth(), now.getDate());

    const reportsRes = await fetch(GAS_DIRECT_URL + '?action=myReports&all=1&userId=' + encodeURIComponent(userId));
    const reports = await reportsRes.json();
    children.forEach(c => { reportsByChild[c] = {}; });
    reports.forEach(r => {
      if (r.date < todayKeyG) return; // 過去の記録は編集対象にしない
      const name = (r.childName && reportsByChild[r.childName]) ? r.childName : children[0];
      reportsByChild[name][r.date] = { pickup: !!r.pickup, location: r.location || 'genkan', startTime: r.startTime || '15:00' };
    });
    selectedChildren = children.slice(); // 初期状態は全員まとめて
    loadChildState();
    renderChips();

    document.getElementById('status').style.display='none';
    document.getElementById('app').style.display='block';
    renderMonth();
    const params = new URLSearchParams(location.search);
    switchTab(params.get('mode') === 'view' ? 'view' : 'input');
  }catch(err){
    document.getElementById('status').textContent = '読み込みに失敗しました。時間を置いてもう一度開いてください。';
  }
}

function switchTab(tab){
  document.getElementById('inputPane').style.display = tab === 'input' ? 'block' : 'none';
  document.getElementById('viewPane').style.display = tab === 'view' ? 'block' : 'none';
  document.getElementById('inputFooter').style.display = tab === 'input' ? 'block' : 'none';

  const title = document.getElementById('pageTitle');
  const guide = document.getElementById('pageGuide');
  const link = document.getElementById('switchLink');

  if(tab === 'input'){
    title.textContent = '利用予定を登録する';
    guide.textContent = '登録済みの日もカレンダーに表示されています。内容の変更はカードを直接編集、取り消しはその日をもう一度タップしてください。最後に1回「送信する」で確定します。';
    link.innerHTML = '<a href="#" id="toView">予定を確認する →</a>';
    document.getElementById('toView').onclick = (e) => { e.preventDefault(); switchTab('view'); };
  } else {
    title.textContent = '予定を確認する';
    guide.textContent = 'これまでに登録した最新の内容です(表示のみ)。変更や取り消しは「利用予定を登録する」から行ってください。';
    link.innerHTML = '<a href="#" id="toInput">利用予定を登録する →</a>';
    document.getElementById('toInput').onclick = (e) => { e.preventDefault(); switchTab('input'); };
    loadSchedule();
  }
}

async function loadSchedule(){
  const listEl = document.getElementById('viewList');
  listEl.innerHTML = '<div class="loadingmsg">読み込み中...</div>';
  try{
    const res = await fetch(GAS_DIRECT_URL + '?action=myReports&all=1&userId=' + encodeURIComponent(userId));
    const reports = await res.json();
    if(!reports.length){
      listEl.innerHTML = '<div class="loadingmsg">まだ登録された予定はありません。</div>';
      return;
    }
    const now = new Date();
    const today = dateKey(now.getFullYear(), now.getMonth(), now.getDate());
    listEl.innerHTML = '';
    const multi = children.length > 1;
    const dates = Array.from(new Set(reports.map(r => r.date))).sort();
    dates.forEach(date => {
      const [y,m,d] = date.split('-').map(Number);
      const dow = ['日','月','火','水','木','金','土'][new Date(y,m-1,d).getDay()];
      const rs = reports.filter(r => r.date === date);
      const detailOf = r => r.pickup ? '利用・' + (PICKUP_LOCATIONS[r.location] || r.location) + '・下校' + r.startTime : '利用・お迎えなし';
      // きょうだいで内容が同じなら1行にまとめる
      const groups = [];
      rs.forEach(r => {
        const dt = detailOf(r);
        const g = groups.find(x => x.dt === dt);
        if (g) g.names.push(r.childName); else groups.push({ dt, names: [r.childName] });
      });
      const body = groups.map(g => multi
        ? '<div class="who">' + g.names.join('・') + 'さん</div><div class="viewdetail">' + g.dt + '</div>'
        : '<div class="viewdetail">' + g.dt + '</div>').join('');
      const card = document.createElement('div');
      card.className = 'viewcard' + (date < today ? ' past' : '');
      card.innerHTML = '<div class="datelabel">' + y + '/' + m + '/' + d + '(' + dow + ')</div>' + body;
      listEl.appendChild(card);
    });
  }catch(err){
    listEl.innerHTML = '<div class="loadingmsg">読み込みに失敗しました。もう一度開き直してください。</div>';
  }
}

function renderMonth(){
  document.getElementById('monthLabel').textContent = viewYear + '年' + (viewMonth+1) + '月';
  const daysEl = document.getElementById('days');
  daysEl.innerHTML = '';
  const firstDow = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  for(let i=0;i<firstDow;i++){
    const e=document.createElement('div'); e.className='day empty'; daysEl.appendChild(e);
  }
  for(let d=1; d<=daysInMonth; d++){
    const key = dateKey(viewYear, viewMonth, d);
    const dow = new Date(viewYear, viewMonth, d).getDay();
    const bookable = isBookable(key, dow) || !!selected[key]; // 既に登録済みの日は取り消せるよう押せるままにする
    const btn = document.createElement('button');
    btn.className = 'day' + (selected[key] ? ' selected' : '') + (bookable ? '' : ' disabled');
    btn.textContent = d;
    if(bookable){
      btn.onclick = () => toggleDay(key);
    }else{
      btn.disabled = true;
    }
    daysEl.appendChild(btn);
  }
  renderList();
}

function toggleDay(key){
  if(selected[key]){
    delete selected[key];
  } else {
    selected[key] = {
      pickup: !!childInfo.defaultPickup,
      location: childInfo.defaultLocation || 'genkan',
      startTime: childInfo.defaultTime || '15:00',
    };
  }
  renderMonth();
}

/* 画面に表示している内容を基準に、選択中のお子さんのうち1人でも登録済みの内容と違えば「送信できる」状態にする。
   (まとめて登録のとき、お子さん同士で予定が違っていても、送信すれば全員同じにそろう) */
function sameAsSelected(rep){
  const curKeys = Object.keys(selected);
  if (curKeys.length !== Object.keys(rep).length) return false;
  return curKeys.every(k => {
    const o = rep[k];
    if (!o) return false;
    const c = selected[k];
    return o.pickup === c.pickup && o.location === c.location && o.startTime === c.startTime;
  });
}
function isDirty(){
  return selectedChildren.some(c => !sameAsSelected(reportsByChild[c] || {}));
}

/* 画面で触った変更があるか(基準のお子さんの登録内容と、いま表示している内容が違うか) */
function isEdited(){
  return !sameAsSelected(reportsByChild[selectedChildren[0]] || {});
}

/* 対象のお子さんが変わった時に、カレンダーに出す内容を切り替える(先頭のお子さんの登録内容を基準に表示) */
function loadChildState(){
  Object.keys(selected).forEach(k => delete selected[k]);
  const base = reportsByChild[selectedChildren[0]] || {};
  Object.keys(base).forEach(k => { selected[k] = { ...base[k] }; });
  originalReports = {};
  Object.keys(base).forEach(k => { originalReports[k] = { ...base[k] }; });
}

function renderChips(){
  const box = document.getElementById('childpick');
  if (children.length < 2) { box.style.display = 'none'; return; }
  box.style.display = 'block';
  const chips = document.getElementById('chips');
  chips.innerHTML = '';
  const allOn = selectedChildren.length === children.length;
  const mk = (label, on, fn) => { const b = document.createElement('button'); b.className = 'chip' + (on ? ' on' : ''); b.textContent = label; b.onclick = fn; chips.appendChild(b); };
  mk('全員まとめて', allOn, () => changeChildren(children.slice()));
  children.forEach(c => mk(c, !allOn && selectedChildren.indexOf(c) >= 0 && selectedChildren.length === 1, () => changeChildren([c])));
  const msg = document.getElementById('pickmsg');
  const differ = selectedChildren.length > 1 && selectedChildren.some(c => !sameAsReports(reportsByChild[c] || {}, reportsByChild[selectedChildren[0]] || {}));
  msg.textContent = differ ? '※ お子さんごとに登録済みの予定が違います。いま表示しているのは「' + selectedChildren[0] + '」さんの内容です。送信すると、選んだ全員がこの内容にそろいます。' : '';
}
function sameAsReports(a, b){
  const ak = Object.keys(a), bk = Object.keys(b);
  if (ak.length !== bk.length) return false;
  return ak.every(k => b[k] && a[k].pickup === b[k].pickup && a[k].location === b[k].location && a[k].startTime === b[k].startTime);
}
function changeChildren(list){
  if (list.join('|') === selectedChildren.join('|')) return;
  if (isEdited() && !confirm('まだ送信していない変更があります。お子さんを切り替えると、その変更は消えます。よろしいですか？')) return;
  selectedChildren = list;
  loadChildState();
  renderChips();
  renderMonth();
}

function renderList(){
  const list = document.getElementById('list');
  const monthPrefix = viewYear + '-' + pad(viewMonth+1);
  const keys = Object.keys(selected).filter(k => k.startsWith(monthPrefix)).sort();
  document.getElementById('empty-hint').style.display = keys.length ? 'none' : 'block';
  document.getElementById('submitBtn').disabled = !isDirty();
  document.getElementById('submitBtn').textContent = selectedChildren.length > 1 ? '選択した日を、' + selectedChildren.length + '人まとめて送信する' : (children.length > 1 ? '選択した日を、' + selectedChildren[0] + 'さんの分として送信する' : '選択した日を送信する');
  list.innerHTML = '';
  keys.forEach(key => {
    const item = selected[key];
    const card = document.createElement('div');
    card.className = 'card';
    const [y,m,d] = key.split('-').map(Number);
    const dow = ['日','月','火','水','木','金','土'][new Date(y,m-1,d).getDay()];
    const isExisting = !!originalReports[key];
    card.innerHTML = `
      <div class="cardhead">
        <div class="datelabel">${m}/${d}(${dow})${isExisting ? '<span class="existing-tag">登録済み</span>' : ''}</div>
        <button class="remove" data-key="${key}">${isExisting ? '取り消す' : '削除'}</button>
      </div>
      <div class="toggle-row">
        <button class="pk ${item.pickup ? 'on':''}" data-key="${key}" data-v="1">お迎え必要</button>
        <button class="pk ${!item.pickup ? 'on':''}" data-key="${key}" data-v="0">お迎え不要</button>
      </div>
      ${item.pickup ? `
      <div class="toggle-row">
        <button class="loc ${item.location==='genkan'?'on':''}" data-key="${key}" data-v="genkan">玄関</button>
        <button class="loc ${item.location==='classroom'?'on':''}" data-key="${key}" data-v="classroom">子ども教室</button>
      </div>
      <div class="detail-row">
        <label>時刻</label>
        <input type="time" class="time" data-key="${key}" value="${item.startTime}">
      </div>` : ''}
    `;
    list.appendChild(card);
  });

  list.querySelectorAll('.remove').forEach(b => b.onclick = () => { delete selected[b.dataset.key]; renderMonth(); });
  list.querySelectorAll('.pk').forEach(b => b.onclick = () => { selected[b.dataset.key].pickup = b.dataset.v==='1'; renderMonth(); });
  list.querySelectorAll('.loc').forEach(b => b.onclick = () => { selected[b.dataset.key].location = b.dataset.v; renderList(); });
  list.querySelectorAll('.time').forEach(inp => inp.onchange = () => { selected[inp.dataset.key].startTime = inp.value; });
}

document.getElementById('prevMonth').onclick = () => {
  viewMonth--; if(viewMonth<0){viewMonth=11; viewYear--;}
  renderMonth();
};
document.getElementById('nextMonth').onclick = () => {
  viewMonth++; if(viewMonth>11){viewMonth=0; viewYear++;}
  renderMonth();
};

document.getElementById('submitBtn').onclick = async () => {
  const days = Object.keys(selected).map(key => ({ date:key, ...selected[key] }));
  // 取り消す日: 選んだお子さんのうち誰かに登録済みで、今の画面では選ばれていない日(まとめて登録のときは全員そろえる)
  const delSet = new Set();
  selectedChildren.forEach(c => Object.keys(reportsByChild[c] || {}).forEach(k => { if (!selected[k]) delSet.add(k); }));
  const deletes = Array.from(delSet);
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('submitmsg').textContent = '送信中...';
  try{
    await fetch(GAS_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action:'batchSubmit', userId, days, deletes, children: selectedChildren }),
    });
    document.getElementById('submitmsg').textContent = '送信しました。トーク画面に戻ってください。';
    selectedChildren.forEach(c => {
      reportsByChild[c] = {};
      Object.keys(selected).forEach(k => { reportsByChild[c][k] = { ...selected[k] }; });
    });
    loadChildState();
    renderChips();
    renderMonth();
  }catch(err){
    document.getElementById('submitmsg').textContent = '送信に失敗しました。もう一度お試しください。';
    document.getElementById('submitBtn').disabled = false;
  }
};

boot();
</script>
</body>
</html>
