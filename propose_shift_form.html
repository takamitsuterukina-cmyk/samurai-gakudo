<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>さむらい学童 シフト相談</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;background:#f5f5f5;color:#1a202c;min-height:100vh;}
.header{background:#1c1a16;color:#fff;padding:16px;text-align:center;}
.header h1{font-size:18px;font-weight:700;}
.header p{font-size:12px;opacity:.7;margin-top:4px;}
.container{max-width:480px;margin:0 auto;padding:16px;}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.card h2{font-size:15px;font-weight:600;margin-bottom:12px;color:#2b6cb0;}
.hint{font-size:12px;color:#888;margin-bottom:12px;line-height:1.6;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:#666;margin-bottom:5px;font-weight:500;}
.field select,.field input[type=text],.field input[type=month]{width:100%;max-width:100%;height:44px;border:1px solid #ddd;border-radius:8px;padding:0 12px;font-size:15px;background:#fff;color:#1a202c;-webkit-appearance:none;appearance:none;box-sizing:border-box;}
.month-disp{text-align:center;font-size:20px;font-weight:700;color:#2b6cb0;padding:8px 0;}
.staff-name-disp{font-size:18px;font-weight:700;color:#1c1a16;text-align:center;padding:4px 0;}

/* いつもの時間 */
.usual-row{margin-bottom:12px;}
.usual-row:last-child{margin-bottom:0;}
.usual-label{font-size:13px;font-weight:600;margin-bottom:6px;}
.usual-row.need .usual-label{color:#e53e3e;}
.time-row{display:flex;gap:8px;align-items:center;}
.time-row select{flex:1;height:44px;border:1px solid #ddd;border-radius:8px;padding:0 8px;font-size:15px;background:#fff;}
.time-sep{font-size:14px;color:#888;flex-shrink:0;}

/* カレンダー */
.bulk-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.bulk-btn{padding:7px 10px;border:1px solid #cbd5e0;border-radius:8px;background:#fff;font-size:12px;font-weight:600;cursor:pointer;}
.bulk-btn:active{transform:scale(.96);}
.bulk-btn.danger{border-color:#fc8181;color:#e53e3e;margin-left:auto;}
.cal-msg{display:none;background:#fff5f5;border:1px solid #feb2b2;color:#c53030;border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:10px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-h{text-align:center;font-size:12px;color:#666;padding:2px 0;font-weight:600;}
.cal-h.sat{color:#2b6cb0;}
.cal-h.sun{color:#e53e3e;}
.cal-cell{min-height:58px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:16px;font-weight:700;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;}
.cal-cell:active{transform:scale(.95);}
.cal-cell .t{font-size:9px;font-weight:500;line-height:1.25;color:#4a5568;text-align:center;}
.cal-cell.sat .n{color:#2b6cb0;}
.cal-cell.on{background:#2b6cb0;border-color:#2b6cb0;color:#fff;}
.cal-cell.on .n{color:#fff;}
.cal-cell.on .t{color:#e2e8f0;}
.cal-cell.off{background:#f1f1f1;color:#aaa;cursor:default;}
.cal-cell.off:active{transform:none;}

/* 選んだ日の一覧 */
.sel-row{background:#ebf8ff;border:1px solid #90cdf4;border-radius:10px;padding:10px;margin-bottom:8px;}
.sel-row.diff{background:#fffaf0;border-color:#f6ad55;}
.sel-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.sel-day{font-size:15px;font-weight:700;}
.sel-day .sat{color:#2b6cb0;}
.tag{font-size:11px;color:#c05621;font-weight:600;margin-left:8px;}
.x-btn{padding:4px 10px;border:1px solid #fc8181;border-radius:6px;background:#fff;font-size:12px;color:#e53e3e;cursor:pointer;}
.sel-row .time-row select{height:40px;font-size:14px;}
.empty{font-size:13px;color:#a0aec0;text-align:center;padding:8px 0;}

.submit-btn{width:100%;padding:16px;background:#1c1a16;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px;}
.submit-btn:active{opacity:.85;}
.result-box{background:#c6f6d5;border-radius:8px;padding:12px;margin-top:12px;font-size:13px;color:#276749;display:none;}
</style>
</head>
<body>
<div class="header">
  <h1>💬 さむらい学童 シフト相談</h1>
  <p>複数日まとめて、この日程で入れないか打診します</p>
</div>
<div class="container">
  <div class="card">
    <h2>① 相手・対象月</h2>
    <div class="field">
      <label>スタッフ名</label>
      <select id="staff-select" onchange="onStaffChange()">
        <option value="">-- 選択してください --</option>
        <option value="照喜名">照喜名 / Terukina</option>
        <option value="オゲ">オゲ / Oge</option>
        <option value="新関">新関 / Niizeki</option>
        <option value="森">森 / Mori</option>
        <option value="中村">中村 / Nakamura</option>
        <option value="芝田">芝田 / Shibata</option>
        <option value="荻島">荻島 / Ogishima</option>
        <option value="テスト">テスト(デモ用)</option>
      </select>
    </div>
    <div class="field">
      <label>対象月</label>
      <input type="month" id="month-input" onchange="onMonthChange()">
    </div>
    <div id="staff-month-disp" style="display:none;">
      <div class="staff-name-disp" id="staff-disp"></div>
      <div class="month-disp" id="month-disp"></div>
    </div>
  </div>

  <div id="usual-card" class="card" style="display:none;">
    <h2>② いつもの時間</h2>
    <p class="hint">一度選ぶと、このスマホが覚えています。相手ごとに別々に覚えます。</p>
    <div class="usual-row" id="usual-wk">
      <div class="usual-label">平日（月〜金）</div>
      <div class="time-row">
        <select id="u-wk-s" onchange="onUsualChange()"></select>
        <span class="time-sep">〜</span>
        <select id="u-wk-e" onchange="onUsualChange()"></select>
      </div>
    </div>
    <div class="usual-row" id="usual-sat">
      <div class="usual-label">土曜（土曜に打診しない時は空のままで大丈夫です）</div>
      <div class="time-row">
        <select id="u-sat-s" onchange="onUsualChange()"></select>
        <span class="time-sep">〜</span>
        <select id="u-sat-e" onchange="onUsualChange()"></select>
      </div>
    </div>
  </div>

  <div id="calendar-card" class="card" style="display:none;">
    <h2>③ 提案したい日をタップ</h2>
    <p class="hint">タップした日は「いつもの時間」で入ります。もう一度タップすると取り消せます。</p>
    <div class="bulk-row">
      <button class="bulk-btn" onclick="selectAll('wk')">平日すべて</button>
      <button class="bulk-btn" onclick="selectAll('sat')">土曜すべて</button>
      <button class="bulk-btn danger" onclick="clearAll()">全部取り消す</button>
    </div>
    <div class="cal-msg" id="cal-msg"></div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>

  <div id="list-card" class="card" style="display:none;">
    <h2>④ 選んだ日の時間</h2>
    <p class="hint">いつもと違う時間の日だけ、ここで変えてください。</p>
    <div id="sel-list"></div>
  </div>

  <div id="submit-card" style="display:none;">
    <button class="submit-btn" onclick="sendProposal()">📤 提案を送る</button>
    <div class="result-box" id="result-box"></div>
  </div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbw6Lovy7vdSnGox7dJfFegh1FpgZzWQNRAS8hk7fibFI5FoF1ajviLzVxxaHft4TJHt/exec';

const STAFF_EN={'照喜名':'Terukina','オゲ':'Oge','新関':'Niizeki','森':'Mori','中村':'Nakamura','芝田':'Shibata','荻島':'Ogishima','テスト':'Test'};
const TIMES=['6:00','6:30','7:00','7:30','8:00','8:30','9:00','9:30','10:00','10:30',
  '11:00','11:30','12:00','12:30','13:00','13:30','14:00','14:30','15:00','15:30',
  '16:00','16:30','17:00','17:30','18:00','18:30','19:00','19:30','20:00'];
const DOW=['日','月','火','水','木','金','土'];

let currentStaff='';
let currentYm='';
// {day: {start, end}}
let shiftData={};
// いつもの時間(相手ごとにこのスマホへ保存)
let usual={wk:{start:'',end:''},sat:{start:'',end:''}};

(function(){
  const d=new Date();
  d.setMonth(d.getMonth()+1);
  const ym=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  document.getElementById('month-input').value=ym;
  fillTimeSelect('u-wk-s','-- 開始 --');
  fillTimeSelect('u-wk-e','-- 終了 --');
  fillTimeSelect('u-sat-s','-- 開始 --');
  fillTimeSelect('u-sat-e','-- 終了 --');
})();

function fillTimeSelect(id,placeholder,selected){
  const el=document.getElementById(id);
  el.innerHTML=`<option value="">${placeholder}</option>`+TIMES.map(t=>`<option value="${t}"${selected===t?' selected':''}>${t}</option>`).join('');
}

function usualKey(){return`propose_usual_${currentStaff}`;}
function loadUsual(){
  usual={wk:{start:'',end:''},sat:{start:'',end:''}};
  try{
    const s=localStorage.getItem(usualKey());
    if(s){
      const o=JSON.parse(s);
      usual.wk=Object.assign(usual.wk,o.wk||{});
      usual.sat=Object.assign(usual.sat,o.sat||{});
    }
  }catch(e){}
}
function saveUsual(){
  try{localStorage.setItem(usualKey(),JSON.stringify(usual));}catch(e){}
}
function syncUsualInputs(){
  fillTimeSelect('u-wk-s','-- 開始 --',usual.wk.start);
  fillTimeSelect('u-wk-e','-- 終了 --',usual.wk.end);
  fillTimeSelect('u-sat-s','-- 開始 --',usual.sat.start);
  fillTimeSelect('u-sat-e','-- 終了 --',usual.sat.end);
}
function onUsualChange(){
  usual.wk.start=document.getElementById('u-wk-s').value;
  usual.wk.end=document.getElementById('u-wk-e').value;
  usual.sat.start=document.getElementById('u-sat-s').value;
  usual.sat.end=document.getElementById('u-sat-e').value;
  saveUsual();
  document.getElementById('usual-wk').classList.remove('need');
  document.getElementById('usual-sat').classList.remove('need');
  hideCalMsg();
  renderList();
}

function onStaffChange(){
  currentStaff=document.getElementById('staff-select').value;
  shiftData={};
  updateDisplay();
}
function onMonthChange(){
  currentYm=document.getElementById('month-input').value;
  shiftData={};
  updateDisplay();
}
function updateDisplay(){
  const staff=document.getElementById('staff-select').value;
  const ym=document.getElementById('month-input').value;
  if(!staff||!ym) return;
  currentStaff=staff;currentYm=ym;
  const [y,m]=ym.split('-').map(Number);
  loadUsual();
  syncUsualInputs();
  document.getElementById('staff-disp').textContent=staff+' / '+STAFF_EN[staff];
  document.getElementById('month-disp').textContent=y+'年'+m+'月';
  document.getElementById('staff-month-disp').style.display='block';
  document.getElementById('usual-card').style.display='block';
  document.getElementById('calendar-card').style.display='block';
  document.getElementById('list-card').style.display='block';
  document.getElementById('submit-card').style.display='block';
  hideCalMsg();
  refresh();
}

// ===== カレンダー =====
function ymParts(){return currentYm.split('-').map(Number);}
function usualFor(dow){return dow===6?usual.sat:usual.wk;}
function hasUsual(u){return !!(u.start&&u.end);}

function showCalMsg(text,needIds){
  const el=document.getElementById('cal-msg');
  el.textContent=text;
  el.style.display='block';
  document.getElementById('usual-wk').classList.remove('need');
  document.getElementById('usual-sat').classList.remove('need');
  (needIds||[]).forEach(id=>document.getElementById(id).classList.add('need'));
  const card=document.getElementById('usual-card');
  if(card&&card.scrollIntoView) card.scrollIntoView({behavior:'smooth',block:'center'});
}
function hideCalMsg(){
  const el=document.getElementById('cal-msg');
  if(el) el.style.display='none';
}

function toggleDay(d){
  const [y,m]=ymParts();
  if(shiftData[d]){
    delete shiftData[d];
  } else {
    const dow=new Date(y,m-1,d).getDay();
    const u=usualFor(dow);
    if(!hasUsual(u)){
      showCalMsg(dow===6?'先に「土曜のいつもの時間」を選んでください':'先に「平日のいつもの時間」を選んでください',[dow===6?'usual-sat':'usual-wk']);
      return;
    }
    shiftData[d]={start:u.start,end:u.end};
  }
  hideCalMsg();
  refresh();
}
function selectAll(kind){
  const [y,m]=ymParts();
  const u=kind==='sat'?usual.sat:usual.wk;
  if(!hasUsual(u)){
    showCalMsg(kind==='sat'?'先に「土曜のいつもの時間」を選んでください':'先に「平日のいつもの時間」を選んでください',[kind==='sat'?'usual-sat':'usual-wk']);
    return;
  }
  const days=new Date(y,m,0).getDate();
  for(let d=1;d<=days;d++){
    const dow=new Date(y,m-1,d).getDay();
    if(dow===0) continue;
    if(kind==='sat'?dow!==6:dow===6) continue;
    if(!shiftData[d]) shiftData[d]={start:u.start,end:u.end};
  }
  hideCalMsg();
  refresh();
}
function clearAll(){
  if(Object.keys(shiftData).length===0) return;
  if(!confirm('選んだ日をすべて取り消しますか？')) return;
  shiftData={};
  refresh();
}
function clearDay(d){
  delete shiftData[d];
  refresh();
}
function onTimeChange(d){
  const s=document.getElementById('s-'+d)?.value||'';
  const e=document.getElementById('e-'+d)?.value||'';
  if(!shiftData[d]||!s||!e) return;
  shiftData[d]={start:s,end:e};
  refresh();
}

function renderCal(){
  const [y,m]=ymParts();
  const days=new Date(y,m,0).getDate();
  const first=(new Date(y,m-1,1).getDay()+6)%7; // 月曜始まり
  let html=['月','火','水','木','金','土','日'].map((n,i)=>`<div class="cal-h${i===5?' sat':''}${i===6?' sun':''}">${n}</div>`).join('');
  for(let i=0;i<first;i++) html+='<div></div>';
  for(let d=1;d<=days;d++){
    const dow=new Date(y,m-1,d).getDay();
    if(dow===0){
      html+=`<div class="cal-cell off"><span class="n">${d}</span><span class="t">休</span></div>`;
      continue;
    }
    const sd=shiftData[d];
    const on=!!(sd&&sd.start&&sd.end);
    html+=`<div class="cal-cell${on?' on':''}${dow===6?' sat':''}" onclick="toggleDay(${d})"><span class="n">${d}</span>${on?`<span class="t">${sd.start}<br>${sd.end}</span>`:''}</div>`;
  }
  document.getElementById('cal-grid').innerHTML=html;
}

function timeOptions(selected){
  return TIMES.map(t=>`<option value="${t}"${selected===t?' selected':''}>${t}</option>`).join('');
}
function renderList(){
  const [y,m]=ymParts();
  const ds=Object.keys(shiftData).map(Number).sort((a,b)=>a-b);
  if(!ds.length){
    document.getElementById('sel-list').innerHTML='<div class="empty">まだ日付が選ばれていません</div>';
    return;
  }
  document.getElementById('sel-list').innerHTML=ds.map(d=>{
    const dow=new Date(y,m-1,d).getDay();
    const sd=shiftData[d];
    const u=usualFor(dow);
    const diff=hasUsual(u)&&(sd.start!==u.start||sd.end!==u.end);
    return`<div class="sel-row${diff?' diff':''}">
      <div class="sel-top">
        <span class="sel-day">${d}日<span class="${dow===6?'sat':''}">(${DOW[dow]})</span>${diff?'<span class="tag">いつもと違う</span>':''}</span>
        <button class="x-btn" onclick="clearDay(${d})">取り消す</button>
      </div>
      <div class="time-row">
        <select id="s-${d}" onchange="onTimeChange(${d})">${timeOptions(sd.start)}</select>
        <span class="time-sep">〜</span>
        <select id="e-${d}" onchange="onTimeChange(${d})">${timeOptions(sd.end)}</select>
      </div>
    </div>`;
  }).join('');
}
function refresh(){
  renderCal();
  renderList();
}

// ===== 送信 =====
function timeToMin(t){const [h,mm]=t.split(':').map(Number);return h*60+mm;}
async function sendProposal(){
  if(!currentStaff||!currentYm){alert('スタッフ名と月を選択してください');return;}
  const ds=Object.keys(shiftData).map(Number).sort((a,b)=>a-b);
  if(ds.length===0){alert('提案したい日を1つ以上選んでください');return;}
  const bad=ds.filter(d=>timeToMin(shiftData[d].end)<=timeToMin(shiftData[d].start));
  if(bad.length){
    alert(bad.map(d=>d+'日').join('、')+'は、終了が開始より前（または同じ）になっています。時間を直してください。');
    return;
  }
  const days={};
  ds.forEach(d=>{days[d]={start:shiftData[d].start,end:shiftData[d].end};});
  const rb=document.getElementById('result-box');
  rb.style.display='block';
  rb.innerHTML='送信中…';
  try{
    const res=await fetch(GAS_URL,{method:'POST',body:JSON.stringify({proposeShift:true,staff:currentStaff,ym:currentYm,days:days})});
    const json=await res.json();
    if(!json.ok) throw new Error(json.error||'送信失敗');
    rb.innerHTML=`✓ ${currentStaff}さんに${ds.length}日分の相談を送りました。返信があれば、teruさんのLINEに転送されます。`;
  }catch(err){
    rb.innerHTML=`⚠ 送信に失敗しました（${err.message}）`;
  }
}
</script>
</body>
</html>
